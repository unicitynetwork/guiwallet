<!DOCTYPE html>
<html>
<head>
    <title>Derive wallet.dat Key</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/elliptic/6.5.4/elliptic.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <h1>Derive Correct Key from wallet.dat Master</h1>
    <pre id="output"></pre>
    
    <script>
        // Bech32 implementation
        const CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
        
        function bech32_polymod(values) {
            const GENERATOR = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
            let chk = 1;
            for (let p = 0; p < values.length; ++p) {
                const top = chk >> 25;
                chk = (chk & 0x1ffffff) << 5 ^ values[p];
                for (let i = 0; i < 5; ++i) {
                    if ((top >> i) & 1) {
                        chk ^= GENERATOR[i];
                    }
                }
            }
            return chk;
        }
        
        function bech32_hrp_expand(hrp) {
            const ret = [];
            for (let p = 0; p < hrp.length; ++p) {
                ret.push(hrp.charCodeAt(p) >> 5);
            }
            ret.push(0);
            for (let p = 0; p < hrp.length; ++p) {
                ret.push(hrp.charCodeAt(p) & 31);
            }
            return ret;
        }
        
        function bech32_create_checksum(hrp, data) {
            const values = bech32_hrp_expand(hrp).concat(data).concat([0, 0, 0, 0, 0, 0]);
            const mod = bech32_polymod(values) ^ 1;
            const ret = [];
            for (let p = 0; p < 6; ++p) {
                ret.push((mod >> 5 * (5 - p)) & 31);
            }
            return ret;
        }
        
        function bech32_encode(hrp, data) {
            const combined = data.concat(bech32_create_checksum(hrp, data));
            let ret = hrp + '1';
            for (let p = 0; p < combined.length; ++p) {
                ret += CHARSET.charAt(combined[p]);
            }
            return ret;
        }
        
        function segwit_addr_encode(hrp, witver, witprog) {
            const ret = bech32_encode(hrp, [witver].concat(convertbits(witprog, 8, 5)));
            return ret;
        }
        
        function convertbits(data, frombits, tobits, pad = true) {
            let acc = 0;
            let bits = 0;
            const ret = [];
            const maxv = (1 << tobits) - 1;
            for (let p = 0; p < data.length; ++p) {
                const value = data[p];
                acc = (acc << frombits) | value;
                bits += frombits;
                while (bits >= tobits) {
                    bits -= tobits;
                    ret.push((acc >> bits) & maxv);
                }
            }
            if (pad) {
                if (bits > 0) {
                    ret.push((acc << (tobits - bits)) & maxv);
                }
            }
            return ret;
        }
        
        // Simple BIP32 derivation
        function deriveKeyPath(masterKey, path) {
            const ec = new elliptic.ec('secp256k1');
            
            // Get master seed
            const seedData = CryptoJS.enc.Hex.parse(masterKey);
            const hmac = CryptoJS.HmacSHA512(seedData, 'Bitcoin seed');
            const hmacHex = hmac.toString();
            
            let currentKey = hmacHex.substring(0, 64);
            let currentChainCode = hmacHex.substring(64);
            
            console.log('Master from seed:');
            console.log('  Key:', currentKey);
            console.log('  Chain:', currentChainCode);
            
            // Derive each level
            for (let i = 0; i < path.length; i++) {
                const index = path[i];
                const isHardened = index >= 0x80000000;
                
                let data;
                if (isHardened) {
                    // Hardened: 0x00 || private_key || index
                    data = '00' + currentKey + index.toString(16).padStart(8, '0');
                } else {
                    // Non-hardened: public_key || index
                    const kp = ec.keyFromPrivate(currentKey);
                    const pubKey = kp.getPublic(true, 'hex');
                    data = pubKey + index.toString(16).padStart(8, '0');
                }
                
                const hmac = CryptoJS.HmacSHA512(
                    CryptoJS.enc.Hex.parse(data),
                    CryptoJS.enc.Hex.parse(currentChainCode)
                );
                const hmacResult = hmac.toString();
                
                const childKey = hmacResult.substring(0, 64);
                const childChainCode = hmacResult.substring(64);
                
                // Add parent key to child key (mod n)
                const n = new elliptic.bn('fffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141', 16);
                const parentKeyBN = new elliptic.bn(currentKey, 16);
                const childKeyBN = new elliptic.bn(childKey, 16);
                const resultKeyBN = parentKeyBN.add(childKeyBN).mod(n);
                
                currentKey = resultKeyBN.toString(16).padStart(64, '0');
                currentChainCode = childChainCode;
                
                console.log(`Level ${i} (index ${index}):`);
                console.log('  Result key:', currentKey);
            }
            
            return currentKey;
        }
        
        const output = document.getElementById('output');
        const masterKey = '44af427cc3e4eca15633682c50383df02f5598ff70ae972060b32529106efea3';
        const expectedAddress = 'alpha1q64c7vmezvqd43l4g0hg8l72uttc0sc5cqrhpqz';
        
        output.textContent = '=== wallet.dat Key Derivation ===\n\n';
        output.textContent += `Master private key: ${masterKey}\n`;
        output.textContent += `Target address: ${expectedAddress}\n\n`;
        
        // From the wallet.dat, we know it uses wpkh(xpub.../84h/1h/0h/0/*)
        // So we need to derive m/84'/1'/0'/0/0
        
        const paths = [
            { name: 'BIP84 mainnet', path: [0x80000054, 0x80000000, 0x80000000, 0, 0] }, // m/84'/0'/0'/0/0
            { name: 'BIP84 testnet', path: [0x80000054, 0x80000001, 0x80000000, 0, 0] }, // m/84'/1'/0'/0/0
        ];
        
        const ec = new elliptic.ec('secp256k1');
        
        paths.forEach(({ name, path }) => {
            output.textContent += `\n=== Testing ${name} ===\n`;
            output.textContent += `Path: m/${path.map((p, i) => i < 3 ? (p - 0x80000000) + "'" : p).join('/')}\n`;
            
            try {
                const derivedKey = deriveKeyPath(masterKey, path);
                output.textContent += `Derived private key: ${derivedKey}\n`;
                
                // Generate address
                const kp = ec.keyFromPrivate(derivedKey);
                const pubKey = kp.getPublic(true, 'hex');
                output.textContent += `Public key: ${pubKey}\n`;
                
                const sha256 = CryptoJS.SHA256(CryptoJS.enc.Hex.parse(pubKey));
                const ripemd160 = CryptoJS.RIPEMD160(sha256);
                const pubkeyHash = ripemd160.toString();
                output.textContent += `Pubkey hash: ${pubkeyHash}\n`;
                
                const hashBytes = [];
                for (let i = 0; i < pubkeyHash.length; i += 2) {
                    hashBytes.push(parseInt(pubkeyHash.substr(i, 2), 16));
                }
                
                const address = segwit_addr_encode('alpha', 0, hashBytes);
                output.textContent += `Generated address: ${address}\n`;
                output.textContent += `Match: ${address === expectedAddress ? 'YES! ✓' : 'NO'}\n`;
                
                if (address === expectedAddress) {
                    output.textContent += '\n*** FOUND THE CORRECT KEY! ***\n';
                    output.textContent += `Use this private key for wallet.dat import: ${derivedKey}\n`;
                }
                
            } catch (error) {
                output.textContent += `Error: ${error.message}\n`;
            }
        });
        
        // Also test if the second key generates the address directly
        output.textContent += '\n\n=== Testing Second Key Directly ===\n';
        const secondKey = '11395f88d9dd258680a74ad1be8c7a350332859769eb99b5bbba592ea53e3200';
        
        try {
            const kp2 = ec.keyFromPrivate(secondKey);
            const pubKey2 = kp2.getPublic(true, 'hex');
            const sha256_2 = CryptoJS.SHA256(CryptoJS.enc.Hex.parse(pubKey2));
            const ripemd160_2 = CryptoJS.RIPEMD160(sha256_2);
            const pubkeyHash2 = ripemd160_2.toString();
            
            const hashBytes2 = [];
            for (let i = 0; i < pubkeyHash2.length; i += 2) {
                hashBytes2.push(parseInt(pubkeyHash2.substr(i, 2), 16));
            }
            
            const address2 = segwit_addr_encode('alpha', 0, hashBytes2);
            
            output.textContent += `Second key: ${secondKey}\n`;
            output.textContent += `Public key: ${pubKey2}\n`;
            output.textContent += `Generated address: ${address2}\n`;
            output.textContent += `Match: ${address2 === expectedAddress ? 'YES! ✓' : 'NO'}\n`;
            
            if (address2 === expectedAddress) {
                output.textContent += '\n*** THE SECOND KEY IS THE ONE! ***\n';
                output.textContent += `Use this private key for wallet.dat import: ${secondKey}\n`;
            }
        } catch (error) {
            output.textContent += `Error: ${error.message}\n`;
        }
    </script>
</body>
</html>

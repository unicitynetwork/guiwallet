<!DOCTYPE html>
<html>
<head>
    <title>Simple Key Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/elliptic/6.5.4/elliptic.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <h1>Simple wallet.dat Key Test</h1>
    <pre id="output"></pre>
    
    <script>
        // Bech32 implementation
        const CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
        
        function bech32_polymod(values) {
            const GENERATOR = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
            let chk = 1;
            for (let p = 0; p < values.length; ++p) {
                const top = chk >> 25;
                chk = (chk & 0x1ffffff) << 5 ^ values[p];
                for (let i = 0; i < 5; ++i) {
                    if ((top >> i) & 1) {
                        chk ^= GENERATOR[i];
                    }
                }
            }
            return chk;
        }
        
        function bech32_hrp_expand(hrp) {
            const ret = [];
            for (let p = 0; p < hrp.length; ++p) {
                ret.push(hrp.charCodeAt(p) >> 5);
            }
            ret.push(0);
            for (let p = 0; p < hrp.length; ++p) {
                ret.push(hrp.charCodeAt(p) & 31);
            }
            return ret;
        }
        
        function bech32_create_checksum(hrp, data) {
            const values = bech32_hrp_expand(hrp).concat(data).concat([0, 0, 0, 0, 0, 0]);
            const mod = bech32_polymod(values) ^ 1;
            const ret = [];
            for (let p = 0; p < 6; ++p) {
                ret.push((mod >> 5 * (5 - p)) & 31);
            }
            return ret;
        }
        
        function bech32_encode(hrp, data) {
            const combined = data.concat(bech32_create_checksum(hrp, data));
            let ret = hrp + '1';
            for (let p = 0; p < combined.length; ++p) {
                ret += CHARSET.charAt(combined[p]);
            }
            return ret;
        }
        
        function segwit_addr_encode(hrp, witver, witprog) {
            const ret = bech32_encode(hrp, [witver].concat(convertbits(witprog, 8, 5)));
            return ret;
        }
        
        function convertbits(data, frombits, tobits, pad = true) {
            let acc = 0;
            let bits = 0;
            const ret = [];
            const maxv = (1 << tobits) - 1;
            for (let p = 0; p < data.length; ++p) {
                const value = data[p];
                acc = (acc << frombits) | value;
                bits += frombits;
                while (bits >= tobits) {
                    bits -= tobits;
                    ret.push((acc >> bits) & maxv);
                }
            }
            if (pad) {
                if (bits > 0) {
                    ret.push((acc << (tobits - bits)) & maxv);
                }
            }
            return ret;
        }
        
        function testPrivateKey(name, privateKeyHex) {
            const ec = new elliptic.ec('secp256k1');
            const output = [];
            
            output.push(`\n=== Testing ${name} ===`);
            output.push(`Private key: ${privateKeyHex}`);
            
            try {
                // Generate public key
                const kp = ec.keyFromPrivate(privateKeyHex);
                const pubKey = kp.getPublic(true, 'hex');
                output.push(`Public key: ${pubKey}`);
                
                // Generate address
                const sha256 = CryptoJS.SHA256(CryptoJS.enc.Hex.parse(pubKey));
                const ripemd160 = CryptoJS.RIPEMD160(sha256);
                const pubkeyHash = ripemd160.toString();
                output.push(`Pubkey hash: ${pubkeyHash}`);
                
                const hashBytes = [];
                for (let i = 0; i < pubkeyHash.length; i += 2) {
                    hashBytes.push(parseInt(pubkeyHash.substr(i, 2), 16));
                }
                
                const address = segwit_addr_encode('alpha', 0, hashBytes);
                output.push(`Generated address: ${address}`);
                
                const expectedAddress = 'alpha1q64c7vmezvqd43l4g0hg8l72uttc0sc5cqrhpqz';
                const match = address === expectedAddress;
                output.push(`Match expected: ${match ? 'YES! ✓' : 'NO'}`);
                
                if (match) {
                    output.push('\n*** FOUND THE CORRECT KEY! ***');
                    output.push(`The ${name} generates the target address!`);
                    output.push(`Use private key: ${privateKeyHex}`);
                }
                
            } catch (error) {
                output.push(`Error: ${error.message}`);
            }
            
            return output.join('\n');
        }
        
        const output = document.getElementById('output');
        const expectedAddress = 'alpha1q64c7vmezvqd43l4g0hg8l72uttc0sc5cqrhpqz';
        
        output.textContent = '=== Simple wallet.dat Key Test ===\n';
        output.textContent += `Looking for address: ${expectedAddress}\n`;
        
        // Test both keys from wallet.dat
        output.textContent += testPrivateKey(
            'First Key (Master)',
            '44af427cc3e4eca15633682c50383df02f5598ff70ae972060b32529106efea3'
        );
        
        output.textContent += '\n' + testPrivateKey(
            'Second Key',
            '11395f88d9dd258680a74ad1be8c7a350332859769eb99b5bbba592ea53e3200'
        );
        
        // Since neither key directly generates the address, we need BIP32 derivation
        output.textContent += '\n\n=== Analysis ===\n';
        output.textContent += 'Neither key directly generates the target address.\n';
        output.textContent += 'This confirms we need BIP32 hierarchical derivation.\n\n';
        
        output.textContent += 'From the wallet.dat descriptors, we know it uses:\n';
        output.textContent += '- wpkh(xpub.../84h/1h/0h/0/*) for SegWit addresses\n';
        output.textContent += '- The xpub is: xpub661MyMwAqRbcGvo3ScFFZaTDc4LqgMm2yt2HHPp5UTwGM69DK5FNbukRSuC7dv6h5EU4EpwT32rxpHtdtn9fVyB9HCLnL9VmFMzyMfYCWGV\n\n';
        
        output.textContent += 'The challenge is implementing BIP32 derivation correctly.\n';
        output.textContent += 'The master key 44af427cc3e4eca15633682c50383df02f5598ff70ae972060b32529106efea3\n';
        output.textContent += 'needs to be used with path m/84\'/1\'/0\'/0/0 to derive the correct key.\n\n';
        
        output.textContent += '=== What Alpha-qt Stores ===\n';
        output.textContent += 'The wallet.dat contains:\n';
        output.textContent += '1. Master private key in walletdescriptorkey records\n';
        output.textContent += '2. Wallet descriptors with derivation paths\n';
        output.textContent += '3. The actual addresses are derived from these at runtime\n\n';
        
        output.textContent += 'To properly import this wallet, we need to:\n';
        output.textContent += '1. Use the master key: 44af427cc3e4eca15633682c50383df02f5598ff70ae972060b32529106efea3\n';
        output.textContent += '2. Implement BIP32 derivation for path m/84\'/1\'/0\'/0/0\n';
        output.textContent += '3. This will generate the private key for alpha1q64c7vmezvqd43l4g0hg8l72uttc0sc5cqrhpqz\n';
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Convert Master Key to xprv and Derive Address</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/elliptic/6.5.4/elliptic.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <h1>Convert Master Key to xprv and Derive Address</h1>
    <pre id="output"></pre>
    
    <script>
        // Base58 encoding
        const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
        
        function base58Encode(buffer) {
            const digits = [0];
            for (let i = 0; i < buffer.length; i++) {
                let carry = buffer[i];
                for (let j = 0; j < digits.length; j++) {
                    carry += digits[j] << 8;
                    digits[j] = carry % 58;
                    carry = (carry / 58) | 0;
                }
                while (carry > 0) {
                    digits.push(carry % 58);
                    carry = (carry / 58) | 0;
                }
            }
            let result = '';
            for (let i = digits.length - 1; i >= 0; i--) {
                result += ALPHABET[digits[i]];
            }
            for (let i = 0; i < buffer.length && buffer[i] === 0; i++) {
                result = '1' + result;
            }
            return result;
        }
        
        function sha256Double(data) {
            const first = CryptoJS.SHA256(CryptoJS.enc.Hex.parse(data));
            return CryptoJS.SHA256(first).toString();
        }
        
        // Bech32 implementation
        const CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
        
        function bech32_polymod(values) {
            const GENERATOR = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
            let chk = 1;
            for (let p = 0; p < values.length; ++p) {
                const top = chk >> 25;
                chk = (chk & 0x1ffffff) << 5 ^ values[p];
                for (let i = 0; i < 5; ++i) {
                    if ((top >> i) & 1) {
                        chk ^= GENERATOR[i];
                    }
                }
            }
            return chk;
        }
        
        function bech32_hrp_expand(hrp) {
            const ret = [];
            for (let p = 0; p < hrp.length; ++p) {
                ret.push(hrp.charCodeAt(p) >> 5);
            }
            ret.push(0);
            for (let p = 0; p < hrp.length; ++p) {
                ret.push(hrp.charCodeAt(p) & 31);
            }
            return ret;
        }
        
        function bech32_create_checksum(hrp, data) {
            const values = bech32_hrp_expand(hrp).concat(data).concat([0, 0, 0, 0, 0, 0]);
            const mod = bech32_polymod(values) ^ 1;
            const ret = [];
            for (let p = 0; p < 6; ++p) {
                ret.push((mod >> 5 * (5 - p)) & 31);
            }
            return ret;
        }
        
        function bech32_encode(hrp, data) {
            const combined = data.concat(bech32_create_checksum(hrp, data));
            let ret = hrp + '1';
            for (let p = 0; p < combined.length; ++p) {
                ret += CHARSET.charAt(combined[p]);
            }
            return ret;
        }
        
        function segwit_addr_encode(hrp, witver, witprog) {
            const ret = bech32_encode(hrp, [witver].concat(convertbits(witprog, 8, 5)));
            return ret;
        }
        
        function convertbits(data, frombits, tobits, pad = true) {
            let acc = 0;
            let bits = 0;
            const ret = [];
            const maxv = (1 << tobits) - 1;
            for (let p = 0; p < data.length; ++p) {
                const value = data[p];
                acc = (acc << frombits) | value;
                bits += frombits;
                while (bits >= tobits) {
                    bits -= tobits;
                    ret.push((acc >> bits) & maxv);
                }
            }
            if (pad) {
                if (bits > 0) {
                    ret.push((acc << (tobits - bits)) & maxv);
                }
            }
            return ret;
        }
        
        // BIP32 derivation
        function deriveChildKey(parentKey, parentChainCode, index) {
            const isHardened = index >= 0x80000000;
            let data;
            
            if (isHardened) {
                // Hardened: 0x00 || private_key || index
                data = '00' + parentKey + index.toString(16).padStart(8, '0');
            } else {
                // Non-hardened: public_key || index
                const ec = new elliptic.ec('secp256k1');
                const kp = ec.keyFromPrivate(parentKey);
                const pubKey = kp.getPublic(true, 'hex');
                data = pubKey + index.toString(16).padStart(8, '0');
            }
            
            const hmac = CryptoJS.HmacSHA512(
                CryptoJS.enc.Hex.parse(data),
                CryptoJS.enc.Hex.parse(parentChainCode)
            );
            const hmacHex = hmac.toString();
            
            const childKey = hmacHex.substring(0, 64);
            const childChainCode = hmacHex.substring(64);
            
            // Add parent key to child key (mod n)
            const ec = new elliptic.ec('secp256k1');
            const n = ec.curve.n;
            const parentKeyBN = new ec.curve.red(parentKey, 16);
            const childKeyBN = new ec.curve.red(childKey, 16);
            const resultKey = parentKeyBN.redAdd(childKeyBN).fromRed();
            
            return {
                key: resultKey.toString(16).padStart(64, '0'),
                chainCode: childChainCode
            };
        }
        
        const output = document.getElementById('output');
        const masterKey = '44af427cc3e4eca15633682c50383df02f5598ff70ae972060b32529106efea3';
        const expectedAddress = 'alpha1q64c7vmezvqd43l4g0hg8l72uttc0sc5cqrhpqz';
        
        output.textContent = '=== Converting Master Key to xprv ===\n\n';
        output.textContent += `Master private key: ${masterKey}\n`;
        
        // Derive master chain code from seed
        const seedData = CryptoJS.enc.Hex.parse(masterKey);
        const hmac = CryptoJS.HmacSHA512(seedData, 'Bitcoin seed');
        const hmacHex = hmac.toString();
        const masterChainCode = hmacHex.substring(64);
        
        output.textContent += `Master chain code: ${masterChainCode}\n\n`;
        
        // Create xprv
        const version = '0488ade4'; // xprv version bytes
        const depth = '00';
        const parentFingerprint = '00000000';
        const childNumber = '00000000';
        const xprvData = version + depth + parentFingerprint + childNumber + masterChainCode + '00' + masterKey;
        const checksum = sha256Double(xprvData).substring(0, 8);
        const fullData = xprvData + checksum;
        
        const bytes = [];
        for (let i = 0; i < fullData.length; i += 2) {
            bytes.push(parseInt(fullData.substr(i, 2), 16));
        }
        const xprv = base58Encode(new Uint8Array(bytes));
        
        output.textContent += `xprv: ${xprv}\n\n`;
        
        // Now derive the address using BIP84 path: m/84'/1'/0'/0/0
        // Note: Alpha might use coin type 0 (Bitcoin) or 1 (testnet), let's try both
        output.textContent += '=== Deriving Addresses ===\n\n';
        
        const coinTypes = [0, 1]; // Try both mainnet and testnet coin types
        
        coinTypes.forEach(coinType => {
            output.textContent += `\nTrying coin type ${coinType}:\n`;
            
            let currentKey = masterKey;
            let currentChainCode = masterChainCode;
            
            // m/84'
            const purpose = deriveChildKey(currentKey, currentChainCode, 84 + 0x80000000);
            currentKey = purpose.key;
            currentChainCode = purpose.chainCode;
            
            // m/84'/[coinType]'
            const coin = deriveChildKey(currentKey, currentChainCode, coinType + 0x80000000);
            currentKey = coin.key;
            currentChainCode = coin.chainCode;
            
            // m/84'/[coinType]'/0'
            const account = deriveChildKey(currentKey, currentChainCode, 0 + 0x80000000);
            currentKey = account.key;
            currentChainCode = account.chainCode;
            
            // m/84'/[coinType]'/0'/0
            const change = deriveChildKey(currentKey, currentChainCode, 0);
            currentKey = change.key;
            currentChainCode = change.chainCode;
            
            // m/84'/[coinType]'/0'/0/0
            const addrIndex = deriveChildKey(currentKey, currentChainCode, 0);
            const finalKey = addrIndex.key;
            
            output.textContent += `  Path: m/84'/${coinType}'/0'/0/0\n`;
            output.textContent += `  Private key: ${finalKey}\n`;
            
            // Generate address
            const ec = new elliptic.ec('secp256k1');
            const kp = ec.keyFromPrivate(finalKey);
            const pubKey = kp.getPublic(true, 'hex');
            
            const sha256 = CryptoJS.SHA256(CryptoJS.enc.Hex.parse(pubKey));
            const ripemd160 = CryptoJS.RIPEMD160(sha256);
            const pubkeyHash = ripemd160.toString();
            
            const hashBytes = [];
            for (let i = 0; i < pubkeyHash.length; i += 2) {
                hashBytes.push(parseInt(pubkeyHash.substr(i, 2), 16));
            }
            
            const address = segwit_addr_encode('alpha', 0, hashBytes);
            output.textContent += `  Address: ${address}\n`;
            output.textContent += `  Match: ${address === expectedAddress ? 'YES! ✓' : 'NO'}\n`;
            
            if (address === expectedAddress) {
                output.textContent += '\n*** FOUND THE CORRECT PATH! ***\n';
                output.textContent += `Use private key: ${finalKey}\n`;
            }
        });
        
        // Also try the second key from wallet.dat
        output.textContent += '\n\n=== Testing Second Key ===\n';
        const secondKey = '11395f88d9dd258680a74ad1be8c7a350332859769eb99b5bbba592ea53e3200';
        
        const ec = new elliptic.ec('secp256k1');
        const kp2 = ec.keyFromPrivate(secondKey);
        const pubKey2 = kp2.getPublic(true, 'hex');
        
        const sha256_2 = CryptoJS.SHA256(CryptoJS.enc.Hex.parse(pubKey2));
        const ripemd160_2 = CryptoJS.RIPEMD160(sha256_2);
        const pubkeyHash2 = ripemd160_2.toString();
        
        const hashBytes2 = [];
        for (let i = 0; i < pubkeyHash2.length; i += 2) {
            hashBytes2.push(parseInt(pubkeyHash2.substr(i, 2), 16));
        }
        
        const address2 = segwit_addr_encode('alpha', 0, hashBytes2);
        output.textContent += `Second key: ${secondKey}\n`;
        output.textContent += `Address: ${address2}\n`;
        output.textContent += `Match: ${address2 === expectedAddress ? 'YES! ✓' : 'NO'}\n`;
    </script>
</body>
</html>

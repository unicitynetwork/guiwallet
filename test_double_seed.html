<!DOCTYPE html>
<html>
<head>
    <title>Test Alpha Double-Seed Theory</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/elliptic/6.5.4/elliptic.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <h1>Testing Alpha's Double-Seed Approach</h1>
    <pre id="output"></pre>
    
    <script>
        // Bech32 implementation
        const CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
        
        function bech32_polymod(values) {
            const GENERATOR = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
            let chk = 1;
            for (let p = 0; p < values.length; ++p) {
                const top = chk >> 25;
                chk = (chk & 0x1ffffff) << 5 ^ values[p];
                for (let i = 0; i < 5; ++i) {
                    if ((top >> i) & 1) {
                        chk ^= GENERATOR[i];
                    }
                }
            }
            return chk;
        }
        
        function bech32_hrp_expand(hrp) {
            const ret = [];
            for (let p = 0; p < hrp.length; ++p) {
                ret.push(hrp.charCodeAt(p) >> 5);
            }
            ret.push(0);
            for (let p = 0; p < hrp.length; ++p) {
                ret.push(hrp.charCodeAt(p) & 31);
            }
            return ret;
        }
        
        function bech32_create_checksum(hrp, data) {
            const values = bech32_hrp_expand(hrp).concat(data).concat([0, 0, 0, 0, 0, 0]);
            const mod = bech32_polymod(values) ^ 1;
            const ret = [];
            for (let p = 0; p < 6; ++p) {
                ret.push((mod >> 5 * (5 - p)) & 31);
            }
            return ret;
        }
        
        function bech32_encode(hrp, data) {
            const combined = data.concat(bech32_create_checksum(hrp, data));
            let ret = hrp + '1';
            for (let p = 0; p < combined.length; ++p) {
                ret += CHARSET.charAt(combined[p]);
            }
            return ret;
        }
        
        function segwit_addr_encode(hrp, witver, witprog) {
            const ret = bech32_encode(hrp, [witver].concat(convertbits(witprog, 8, 5)));
            return ret;
        }
        
        function convertbits(data, frombits, tobits, pad = true) {
            let acc = 0;
            let bits = 0;
            const ret = [];
            const maxv = (1 << tobits) - 1;
            for (let p = 0; p < data.length; ++p) {
                const value = data[p];
                acc = (acc << frombits) | value;
                bits += frombits;
                while (bits >= tobits) {
                    bits -= tobits;
                    ret.push((acc >> bits) & maxv);
                }
            }
            if (pad) {
                if (bits > 0) {
                    ret.push((acc << (tobits - bits)) & maxv);
                }
            }
            return ret;
        }
        
        // BIP32 derivation with modular addition
        function addPrivateKeys(key1Hex, key2Hex) {
            const n = BigInt('0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141');
            const key1 = BigInt('0x' + key1Hex);
            const key2 = BigInt('0x' + key2Hex);
            let sum = (key1 + key2) % n;
            if (sum < 0n) sum += n;
            return sum.toString(16).padStart(64, '0');
        }
        
        function deriveWithDoubleSeed(walletKey, path) {
            const ec = new elliptic.ec('secp256k1');
            
            // Alpha's approach: treat the wallet key as a seed
            // This is like doing HMAC-SHA512("Bitcoin seed", wallet_key)
            const seedData = CryptoJS.enc.Hex.parse(walletKey);
            const hmac = CryptoJS.HmacSHA512(seedData, 'Bitcoin seed');
            const hmacHex = hmac.toString();
            
            let currentKey = hmacHex.substring(0, 64);
            let currentChainCode = hmacHex.substring(64);
            
            console.log('Double-seed result:');
            console.log('  Key:', currentKey);
            console.log('  Chain code:', currentChainCode);
            
            // Now derive the path
            for (let i = 0; i < path.length; i++) {
                const index = path[i];
                const hardened = index >= 0x80000000;
                
                let data;
                if (hardened) {
                    data = '00' + currentKey + index.toString(16).padStart(8, '0');
                } else {
                    const kp = ec.keyFromPrivate(currentKey, 'hex');
                    const pubKey = kp.getPublic(true, 'hex');
                    data = pubKey + index.toString(16).padStart(8, '0');
                }
                
                const hmac = CryptoJS.HmacSHA512(
                    CryptoJS.enc.Hex.parse(data),
                    CryptoJS.enc.Hex.parse(currentChainCode)
                );
                const hmacResult = hmac.toString();
                
                const childKey = hmacResult.substring(0, 64);
                const childChainCode = hmacResult.substring(64);
                
                currentKey = addPrivateKeys(currentKey, childKey);
                currentChainCode = childChainCode;
            }
            
            return currentKey;
        }
        
        const output = document.getElementById('output');
        const walletKey = '44af427cc3e4eca15633682c50383df02f5598ff70ae972060b32529106efea3';
        const expectedAddress = 'alpha1q64c7vmezvqd43l4g0hg8l72uttc0sc5cqrhpqz';
        
        output.textContent = '=== Testing Alpha\'s Double-Seed Theory ===\n\n';
        output.textContent += `Wallet key: ${walletKey}\n`;
        output.textContent += `Target: ${expectedAddress}\n\n`;
        
        output.textContent += 'Theory: Alpha treats the wallet.dat key as a seed and applies\n';
        output.textContent += 'HMAC-SHA512("Bitcoin seed", key) before BIP32 derivation.\n\n';
        
        const paths = [
            { name: 'm/84\'/1\'/0\'/0/0', indices: [0x80000054, 0x80000001, 0x80000000, 0, 0] },
            { name: 'm/84\'/0\'/0\'/0/0', indices: [0x80000054, 0x80000000, 0x80000000, 0, 0] },
            { name: 'm/0/0', indices: [0, 0] }, // Simple path
            { name: 'm/0', indices: [0] } // Even simpler
        ];
        
        const ec = new elliptic.ec('secp256k1');
        
        paths.forEach(({ name, indices }) => {
            output.textContent += `\n=== Testing path ${name} ===\n`;
            
            try {
                const derivedKey = deriveWithDoubleSeed(walletKey, indices);
                output.textContent += `Derived key: ${derivedKey}\n`;
                
                // Generate address
                const kp = ec.keyFromPrivate(derivedKey, 'hex');
                const pubKey = kp.getPublic(true, 'hex');
                
                const sha256 = CryptoJS.SHA256(CryptoJS.enc.Hex.parse(pubKey));
                const ripemd160 = CryptoJS.RIPEMD160(sha256);
                const pubkeyHash = ripemd160.toString();
                
                const hashBytes = [];
                for (let i = 0; i < pubkeyHash.length; i += 2) {
                    hashBytes.push(parseInt(pubkeyHash.substr(i, 2), 16));
                }
                
                const address = segwit_addr_encode('alpha', 0, hashBytes);
                
                output.textContent += `Address: ${address}\n`;
                output.textContent += `Match: ${address === expectedAddress ? 'YES! ✓' : 'NO'}\n`;
                
                if (address === expectedAddress) {
                    output.textContent += '\n*** FOUND! ***\n';
                    output.textContent += `Alpha uses double-seeding with path ${name}\n`;
                    output.textContent += `Final private key: ${derivedKey}\n`;
                }
                
            } catch (error) {
                output.textContent += `Error: ${error.message}\n`;
            }
        });
        
        // Also test if the second key works with this approach
        output.textContent += '\n\n=== Testing Second Key with Double-Seed ===\n';
        const secondKey = '11395f88d9dd258680a74ad1be8c7a350332859769eb99b5bbba592ea53e3200';
        
        try {
            const derivedKey = deriveWithDoubleSeed(secondKey, [0]); // Try simple m/0
            const kp = ec.keyFromPrivate(derivedKey, 'hex');
            const pubKey = kp.getPublic(true, 'hex');
            const sha256 = CryptoJS.SHA256(CryptoJS.enc.Hex.parse(pubKey));
            const ripemd160 = CryptoJS.RIPEMD160(sha256);
            const pubkeyHash = ripemd160.toString();
            
            const hashBytes = [];
            for (let i = 0; i < pubkeyHash.length; i += 2) {
                hashBytes.push(parseInt(pubkeyHash.substr(i, 2), 16));
            }
            
            const address = segwit_addr_encode('alpha', 0, hashBytes);
            
            output.textContent += `Second key with m/0: ${address}\n`;
            output.textContent += `Match: ${address === expectedAddress ? 'YES! ✓' : 'NO'}\n`;
        } catch (error) {
            output.textContent += `Error: ${error.message}\n`;
        }
    </script>
</body>
</html>

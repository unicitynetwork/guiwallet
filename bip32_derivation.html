<!DOCTYPE html>
<html>
<head>
    <title>BIP32 Derivation for wallet.dat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/elliptic/6.5.4/elliptic.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <h1>BIP32 Derivation to Find wallet.dat Key</h1>
    <pre id="output"></pre>
    
    <script>
        // Bech32 implementation for address encoding
        const CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
        
        function bech32_polymod(values) {
            const GENERATOR = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
            let chk = 1;
            for (let p = 0; p < values.length; ++p) {
                const top = chk >> 25;
                chk = (chk & 0x1ffffff) << 5 ^ values[p];
                for (let i = 0; i < 5; ++i) {
                    if ((top >> i) & 1) {
                        chk ^= GENERATOR[i];
                    }
                }
            }
            return chk;
        }
        
        function bech32_hrp_expand(hrp) {
            const ret = [];
            for (let p = 0; p < hrp.length; ++p) {
                ret.push(hrp.charCodeAt(p) >> 5);
            }
            ret.push(0);
            for (let p = 0; p < hrp.length; ++p) {
                ret.push(hrp.charCodeAt(p) & 31);
            }
            return ret;
        }
        
        function bech32_create_checksum(hrp, data) {
            const values = bech32_hrp_expand(hrp).concat(data).concat([0, 0, 0, 0, 0, 0]);
            const mod = bech32_polymod(values) ^ 1;
            const ret = [];
            for (let p = 0; p < 6; ++p) {
                ret.push((mod >> 5 * (5 - p)) & 31);
            }
            return ret;
        }
        
        function bech32_encode(hrp, data) {
            const combined = data.concat(bech32_create_checksum(hrp, data));
            let ret = hrp + '1';
            for (let p = 0; p < combined.length; ++p) {
                ret += CHARSET.charAt(combined[p]);
            }
            return ret;
        }
        
        function segwit_addr_encode(hrp, witver, witprog) {
            const ret = bech32_encode(hrp, [witver].concat(convertbits(witprog, 8, 5)));
            return ret;
        }
        
        function convertbits(data, frombits, tobits, pad = true) {
            let acc = 0;
            let bits = 0;
            const ret = [];
            const maxv = (1 << tobits) - 1;
            for (let p = 0; p < data.length; ++p) {
                const value = data[p];
                acc = (acc << frombits) | value;
                bits += frombits;
                while (bits >= tobits) {
                    bits -= tobits;
                    ret.push((acc >> bits) & maxv);
                }
            }
            if (pad) {
                if (bits > 0) {
                    ret.push((acc << (tobits - bits)) & maxv);
                }
            }
            return ret;
        }
        
        // BIP32 implementation
        function deriveBIP32(masterKeyHex, derivationPath) {
            const ec = new elliptic.ec('secp256k1');
            const curve = ec.curve;
            
            // Convert master key to seed (for wallet.dat, the key IS the seed)
            const masterSeed = CryptoJS.enc.Hex.parse(masterKeyHex);
            
            // Generate master key and chain code from seed
            const hmac = CryptoJS.HmacSHA512(masterSeed, 'Bitcoin seed');
            const hmacHex = hmac.toString();
            
            let privateKey = hmacHex.substring(0, 64);
            let chainCode = hmacHex.substring(64);
            
            console.log('Master from seed:');
            console.log('  Private key:', privateKey);
            console.log('  Chain code:', chainCode);
            
            // Process each level of the derivation path
            for (let i = 0; i < derivationPath.length; i++) {
                const index = derivationPath[i];
                const hardened = index >= 0x80000000;
                
                console.log(`\nLevel ${i}: index ${index} (${hardened ? 'hardened' : 'non-hardened'})`);
                
                let data;
                if (hardened) {
                    // Hardened derivation: data = 0x00 || private_key || index
                    data = '00' + privateKey + index.toString(16).padStart(8, '0');
                } else {
                    // Non-hardened derivation: data = public_key || index
                    const keyPair = ec.keyFromPrivate(privateKey, 'hex');
                    const publicKey = keyPair.getPublic(true, 'hex');
                    data = publicKey + index.toString(16).padStart(8, '0');
                }
                
                console.log('  HMAC input:', data);
                
                // Calculate HMAC-SHA512
                const hmac = CryptoJS.HmacSHA512(
                    CryptoJS.enc.Hex.parse(data),
                    CryptoJS.enc.Hex.parse(chainCode)
                );
                const hmacResult = hmac.toString();
                
                const childPrivateKey = hmacResult.substring(0, 64);
                const childChainCode = hmacResult.substring(64);
                
                console.log('  Child key from HMAC:', childPrivateKey);
                
                // Add parent private key to child private key (mod n)
                const parentKeyBN = new curve.red(privateKey, 16);
                const childKeyBN = new curve.red(childPrivateKey, 16);
                
                // The curve order n for secp256k1
                const n = new curve.red('fffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141', 16);
                
                // Perform modular addition
                const sum = parentKeyBN.redAdd(childKeyBN);
                const resultKey = sum.fromRed().toString(16).padStart(64, '0');
                
                console.log('  Result private key:', resultKey);
                
                // Update for next iteration
                privateKey = resultKey;
                chainCode = childChainCode;
            }
            
            return privateKey;
        }
        
        // Helper to create BN.red properly
        elliptic.ec.prototype.curve.red = function(num, base) {
            // Use the curve's built-in BN
            const BN = this.n.constructor;
            const bn = new BN(num, base);
            return this.n.red ? bn.toRed(this.n.red) : bn;
        };
        
        const output = document.getElementById('output');
        const masterKey = '44af427cc3e4eca15633682c50383df02f5598ff70ae972060b32529106efea3';
        const expectedAddress = 'alpha1q64c7vmezvqd43l4g0hg8l72uttc0sc5cqrhpqz';
        
        output.textContent = '=== BIP32 Derivation for wallet.dat ===\n\n';
        output.textContent += `Master key: ${masterKey}\n`;
        output.textContent += `Target address: ${expectedAddress}\n`;
        output.textContent += `\nFrom wallet.dat descriptors: wpkh(xpub.../84h/1h/0h/0/*)\n\n`;
        
        // Test derivation paths
        const paths = [
            {
                name: 'BIP84 Alpha (m/84\'/1\'/0\'/0/0)',
                path: [
                    84 + 0x80000000,  // 84'
                    1 + 0x80000000,   // 1' (testnet/alpha)
                    0 + 0x80000000,   // 0' (account)
                    0,                // 0 (external)
                    0                 // 0 (first address)
                ]
            }
        ];
        
        const ec = new elliptic.ec('secp256k1');
        
        paths.forEach(({ name, path }) => {
            output.textContent += `\n=== Testing ${name} ===\n`;
            
            try {
                const derivedKey = deriveBIP32(masterKey, path);
                output.textContent += `\nFinal derived private key: ${derivedKey}\n`;
                
                // Generate public key and address
                const keyPair = ec.keyFromPrivate(derivedKey, 'hex');
                const publicKey = keyPair.getPublic(true, 'hex');
                output.textContent += `Public key: ${publicKey}\n`;
                
                // Generate address
                const sha256 = CryptoJS.SHA256(CryptoJS.enc.Hex.parse(publicKey));
                const ripemd160 = CryptoJS.RIPEMD160(sha256);
                const pubkeyHash = ripemd160.toString();
                output.textContent += `Pubkey hash: ${pubkeyHash}\n`;
                
                const hashBytes = [];
                for (let i = 0; i < pubkeyHash.length; i += 2) {
                    hashBytes.push(parseInt(pubkeyHash.substr(i, 2), 16));
                }
                
                const address = segwit_addr_encode('alpha', 0, hashBytes);
                output.textContent += `Generated address: ${address}\n`;
                output.textContent += `Match: ${address === expectedAddress ? 'YES! ✓' : 'NO'}\n`;
                
                if (address === expectedAddress) {
                    output.textContent += '\n*** SUCCESS! FOUND THE CORRECT KEY! ***\n';
                    output.textContent += `\nFor wallet.dat import, use:\n`;
                    output.textContent += `Private key: ${derivedKey}\n`;
                    output.textContent += `This key generates: ${address}\n`;
                }
                
            } catch (error) {
                output.textContent += `Error: ${error.message}\n`;
                console.error(error);
            }
        });
    </script>
</body>
</html>

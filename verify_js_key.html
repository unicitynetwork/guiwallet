<body>
    <h1>Testing if JS key works in our wallet</h1>
    <pre id="output"></pre>
    
    <script>
        // The private key our JavaScript correctly derives
        const privateKey = "f3f19a6c29abaa38fce2d00ac8737fcb50bc52720ddf67d8c59caf0bd0af6726";
        
        // What the Python script says
        const pythonPublicKey = "02006abf41ba147951f55579a2f7d3683f7334e9466df8ffa38a486813651ffb77";
        const pythonAddress = "alpha1q64c7vmezvqd43l4g0hg8l72uttc0sc5cqrhpqz";
        
        // Use elliptic to generate public key
        const ec = new elliptic.ec('secp256k1');
        const keyPair = ec.keyFromPrivate(privateKey);
        const publicKey = keyPair.getPublic(true, 'hex');
        
        const output = document.getElementById('output');
        output.textContent = `Private key: ${privateKey}\n\n`;
        output.textContent += `JavaScript public key: ${publicKey}\n`;
        output.textContent += `Python public key:     ${pythonPublicKey}\n`;
        output.textContent += `Match: ${publicKey === pythonPublicKey ? 'YES' : 'NO'}\n\n`;
        
        // The critical question
        output.textContent += `=== The Key Question ===\n`;
        output.textContent += `If the JS elliptic library generates a different public key,\n`;
        output.textContent += `then either:\n`;
        output.textContent += `1. The Python script has a bug in its EC implementation\n`;
        output.textContent += `2. The JS elliptic library has a bug\n`;
        output.textContent += `3. They use different conventions\n\n`;
        
        output.textContent += `Since native wallets work fine with elliptic,\n`;
        output.textContent += `the issue is likely that the Python script's EC implementation\n`;
        output.textContent += `is non-standard or has a bug.\n`;
    </script>
